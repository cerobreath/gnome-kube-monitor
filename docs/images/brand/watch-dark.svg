  <text x="340" y="234" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="rgba(243,231,236,0.52)">ticks on the lower lane are node changes reaching the pipe</text>
