<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" fill="none" role="img" aria-label="Alert lifecycle: inactive to pending on a bad observation, pending to firing once it has held for the debounce, and back only after the hold expires">
<title>Alert lifecycle: inactive to pending on a bad observation, pending to firing once it has held for the debounce, and back only after the hold expires</title>
<style>.tk,.tk2{animation:fl 5s ease-in-out infinite}
.tk2{animation-delay:.45s}
@keyframes fl{0%,58%,100%{opacity:.42}20%,32%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="rgba(43,12,28,0.68)"/>
  </marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#A82740"/>
  </marker>
  <marker id="ahBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#FF5C5C"/>
  </marker></defs>
  <path d="M780,78 C806,34 676,34 684,75" fill="none" stroke="#A82740" stroke-width="1.6" marker-end="url(#ahA)"/>
  <text x="731" y="28" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#A82740">repeat_interval</text>

  <g>
    <rect x="70" y="78" width="158" height="48" rx="9" fill="#FFFFFF" stroke="rgba(168,39,64,0.18)"/>
    <text x="149" y="106.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#2B0C1C">inactive</text>
    
  </g>
  <g>
    <rect x="361" y="78" width="158" height="48" rx="9" fill="#FFFFFF" stroke="#E5A50A"/>
    <text x="440" y="106.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#2B0C1C">pending</text>
    
  </g>
  <g>
    <rect x="652" y="78" width="158" height="48" rx="9" fill="#FFFFFF" stroke="#A82740"/>
    <text x="731" y="106.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#2B0C1C">firing</text>
    
  </g>

  <path class="tk" d="M234,102 H353" fill="none" stroke="rgba(43,12,28,0.68)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="294.5" y="90" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(43,12,28,0.68)">node NotReady</text>

  <path class="tk2" d="M525,102 H644" fill="none" stroke="#A82740" stroke-width="1.6" marker-end="url(#ahA)"/>
  <text x="585.5" y="90" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#A82740">held for `for`</text>
  <text x="585.5" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="rgba(43,12,28,0.62)">notify</text>

  <path d="M440,126 C440,182 149,182 149,134" fill="none" stroke="rgba(43,12,28,0.68)" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/>
  <text x="294.5" y="150" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(43,12,28,0.68)">recovers inside the debounce, silently</text>

  <path d="M731,126 C731,228 149,228 149,134" fill="none" stroke="rgba(43,12,28,0.68)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="440" y="246" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(43,12,28,0.68)">recovers, then holds for `keep_firing_for`, so a flapping node notifies once</text>

</svg>
