    <path d="M354.54,84 l4.16,4.42 L365.98,79.32"/>
  </g>
  <text x="46" y="130" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="rgba(243,231,236,0.66)">The bare language exists, so gettext finds it.</text>
  
  <text x="452" y="32" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#FF5C5C">Never sideways</text>
