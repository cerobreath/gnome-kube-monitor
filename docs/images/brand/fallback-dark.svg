<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="880" height="176" fill="none" role="img" aria-label="gettext falls back from a regional locale down to the bare language, but never sideways to a sibling region">
<title>gettext falls back from a regional locale down to the bare language, but never sideways to a sibling region</title>
<style>.g1{animation:fl 4s ease-in-out infinite}
.no{animation:nn 4s ease-in-out infinite}
@keyframes fl{0%,60%,100%{opacity:.45}22%,34%{opacity:1}}
@keyframes nn{0%,55%,100%{opacity:.6}70%,82%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
