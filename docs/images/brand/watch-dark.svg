  <text x="684" y="84" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(243,231,236,0.66)">of CPU, and 30 process starts</text>

  
