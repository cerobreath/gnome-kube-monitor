<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" fill="none" role="img" aria-label="Five minutes of steady state: thirty kubectl processes when polling, one when the watch holds the stream open">
<title>Five minutes of steady state: thirty kubectl processes when polling, one when the watch holds the stream open</title>
<style>.sp{animation:spawn 4.6s ease-out infinite}
@keyframes spawn{0%,70%,100%{opacity:.42}6%,14%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
