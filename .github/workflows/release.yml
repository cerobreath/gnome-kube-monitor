name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  release:
    name: Package and publish
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write      # Sigstore signing certificate for the attestation
      attestations: write
    env:
      UUID: kube-monitor@cerobreath.dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gettext
      - name: Pack extension zip
        run: ./.github/pack-zip.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.UUID }}.shell-extension.zip
      # The body is the annotated tag's message, not --generate-notes: that builds
      # from merged pull requests, and this project lands work as direct commits.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-from-tag \
            --title "Kube Node Monitor ${GITHUB_REF_NAME#v}" \
            "$UUID.shell-extension.zip"
