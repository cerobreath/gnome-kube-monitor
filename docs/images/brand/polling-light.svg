<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" fill="none" role="img" aria-label="Two-tier polling: 251 bytes with the menu closed, full detail only while it is open">
<title>Two-tier polling: 251 bytes with the menu closed, full detail only while it is open</title>
<style>.pk{animation:pf 2.6s linear infinite}
@keyframes pf{0%,8%{opacity:0}18%,82%{opacity:1}94%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="10" y="14" width="420" height="206" rx="14" fill="#FFFFFF" stroke="rgba(168,39,64,0.18)"/>
  <rect x="10" y="14" width="420" height="3" rx="1.5" fill="#2EC27E"/>
  <text x="32" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B0C1C">Menu closed</text>
  <text x="32" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(43,12,28,0.68)">the steady state, ~99% of the time</text>
  <text x="32" y="108" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="rgba(43,12,28,0.68)">kubectl get nodes</text>
  <text x="32" y="128" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="rgba(43,12,28,0.62)">-o jsonpath=…</text>
  <path id="wa" d="M196,118 H300" stroke="rgba(43,12,28,0.22)" stroke-width="2" stroke-linecap="round"/>
  <circle r="3.5" fill="#A82740" class="pk" style="animation-delay:0s">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s" path="M196,118 H300"/>
  </circle>
  <rect x="300" y="105" width="92" height="26" rx="8" fill="#2EC27E" opacity="0.16"/>
  <text x="346" y="122.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#2EC27E">251 B</text>
  <text x="32" y="172" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="rgba(43,12,28,0.62)">drives</text>
  <text x="32" y="192" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#2B0C1C">panel dot + notifications</text>

  <rect x="450" y="14" width="420" height="206" rx="14" fill="#FFFFFF" stroke="rgba(168,39,64,0.18)"/>
  <rect x="450" y="14" width="420" height="3" rx="1.5" fill="#A82740"/>
  <text x="472" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B0C1C">Menu open</text>
  <text x="472" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(43,12,28,0.68)">full detail, fetched only while you look</text>
  <text x="472" y="100" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="rgba(43,12,28,0.68)">nodes -o json</text>
  <text x="472" y="128" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="rgba(43,12,28,0.68)">top nodes</text>
  <text x="472" y="156" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="rgba(43,12,28,0.68)">pods summary</text>
  <path id="wb" d="M600,96 H700" stroke="rgba(43,12,28,0.22)" stroke-width="2" stroke-linecap="round"/>
  <circle r="3.5" fill="#A82740" class="pk" style="animation-delay:0.2s">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.2s" path="M600,96 H700"/>
  </circle>
  <path id="wc" d="M600,124 H700" stroke="rgba(43,12,28,0.22)" stroke-width="2" stroke-linecap="round"/>
  <circle r="3.5" fill="#A82740" class="pk" style="animation-delay:0.7s">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.7s" path="M600,124 H700"/>
  </circle>
  <path id="wd" d="M600,152 H700" stroke="rgba(43,12,28,0.22)" stroke-width="2" stroke-linecap="round"/>
  <circle r="3.5" fill="#A82740" class="pk" style="animation-delay:1.2s">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="1.2s" path="M600,152 H700"/>
  </circle>
  <rect x="700" y="111" width="150" height="26" rx="8" fill="#A82740" opacity="0.16"/>
  <text x="775" y="128.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#A82740">~36 KB / node</text>
  <text x="472" y="192" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="rgba(43,12,28,0.68)">rows update in place, never rebuilt</text>
</svg>
