  <text x="24" y="32" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2EC27E">Falls back down</text>
  <rect x="24" y="46" width="404" height="104" rx="12" fill="none" stroke="rgba(216,85,106,0.22)"/>
