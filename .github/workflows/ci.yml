name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
            eslint-
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  test:
    name: Unit tests, Node ${{ matrix.node }} (100% coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # 24 is the engines floor (Active LTS); 26 is Current, so a change in
      # node:test or registerHooks shows up here before it reaches LTS.
      matrix:
        node: ['24.x', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm audit --audit-level=high

  i18n:
    name: Translations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      # Checks POTFILES.in against the source tree, LINGUAS against po/*.po, the
      # committed .pot against a fresh extraction, and every catalogue for
      # completeness and format strings matching the msgid.
      - run: npm run i18n:check

  package:
    name: Package extension
    needs: [lint, typecheck, test, i18n]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UUID: kube-monitor@cerobreath.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gettext
      - name: Pack extension zip
        run: ./.github/pack-zip.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zip
          path: ${{ env.UUID }}.shell-extension.zip
          if-no-files-found: error
