name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
            eslint-
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  package:
    name: Package extension
    needs: [lint, typecheck, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UUID: kube-monitor@cerobreath.dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Validate only: --dry-run leaves no gschemas.compiled behind. That matters
      # because `gnome-extensions pack` (npm run pack, the artifact actually
      # uploaded to EGO) ships the .gschema.xml alone and compiles nothing, so
      # writing a compiled file here would make the CI zip differ from it.
      - name: Validate GSettings schema
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin
          glib-compile-schemas --strict --dry-run schemas/
      # Mirrors `npm run pack` exactly. We don't call it directly because
      # `gnome-extensions` lives in the gnome-shell package, which is a very
      # heavy install for a CI runner. Keep this list in step with the pack
      # script in package.json, and exclude the compiled schema plus editor
      # leftovers so a stray file in lib/ or icons/ can never ship.
      - name: Pack extension zip
        run: |
          zip -r "$UUID.shell-extension.zip" \
            metadata.json extension.js prefs.js stylesheet.css LICENSE \
            lib icons schemas \
            -x 'schemas/gschemas.compiled' '*/.*' '*~' '*.orig' '*.rej'
          unzip -l "$UUID.shell-extension.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zip
          path: ${{ env.UUID }}.shell-extension.zip
          if-no-files-found: error
